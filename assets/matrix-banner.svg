<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#1a0b33"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .code { font-family: 'Courier New', monospace; font-size: 14px; fill: #7c3aed; opacity: 0.4; }
      .code.b { fill: #3b82f6; }
      .fall { animation: fall 9s linear infinite; }
      .d2 { animation-duration: 12s; animation-delay: -3s; }
      .d3 { animation-duration: 10s; animation-delay: -6s; }
      @keyframes fall { from { transform: translateY(-300px); } to { transform: translateY(300px); } }
      .title { font-family: 'Courier New', monospace; font-weight: bold; font-size: 52px; letter-spacing: 4px; fill: url(#name); }
      .sub { font-family: 'Courier New', monospace; font-size: 22px; fill: #a5b4fc; }
      .tag { font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 3px; fill: #8b5cf6; opacity: 0.9; }
      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#bg)" stroke="#4c1d95" stroke-width="2"/>

  <g class="fall">
    <text class="code b" x="30" y="40">1 0 &lt; /</text><text class="code" x="30" y="70">{ } ;</text><text class="code b" x="30" y="100">D S A</text><text class="code" x="30" y="130">$ &gt;</text>
    <text class="code" x="130" y="60">py</text><text class="code b" x="130" y="90">=&gt;</text><text class="code" x="130" y="120">[ ]</text><text class="code b" x="130" y="150">01</text>
    <text class="code b" x="260" y="30">&lt;/&gt;</text><text class="code" x="260" y="60">fn</text><text class="code b" x="260" y="90">{ }</text>
  </g>
  <g class="fall d2">
    <text class="code" x="620" y="30">API</text><text class="code b" x="620" y="60">&gt;&gt;</text><text class="code" x="620" y="90">1 1 0</text><text class="code b" x="620" y="120">( )</text>
    <text class="code b" x="760" y="50">AI</text><text class="code" x="760" y="80">#</text><text class="code b" x="760" y="110">LLM</text><text class="code" x="760" y="140">0 1</text>
    <text class="code" x="900" y="40">}</text><text class="code b" x="900" y="70">;</text><text class="code" x="900" y="100">&lt; &gt;</text>
  </g>
  <g class="fall d3">
    <text class="code" x="80" y="150">js</text><text class="code b" x="80" y="180">C++</text><text class="code" x="80" y="210">Go</text>
    <text class="code b" x="840" y="160">SQL</text><text class="code" x="840" y="190">git</text><text class="code b" x="840" y="220">npm</text>
    <text class="code" x="480" y="20">1 0 1</text><text class="code b" x="480" y="250">0 1 0</text>
  </g>

  <rect x="170" y="45" width="660" height="190" rx="14" fill="#050505" fill-opacity="0.88" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="195" cy="68" r="5" fill="#8b5cf6"/>
  <circle cx="213" cy="68" r="5" fill="#3b82f6"/>
  <circle cx="231" cy="68" r="5" fill="#60a5fa"/>

  <text class="title" x="500" y="145" text-anchor="middle" filter="url(#glow)">Krishika Sinha</text>
  <text class="sub" x="500" y="185" text-anchor="middle">&gt; B.Tech CSE &amp; Full-Stack Developer<tspan class="cursor">_</tspan></text>
  <text class="tag" x="500" y="213" text-anchor="middle">// LEARN . BUILD . IMPROVE . REPEAT</text>
</svg>
